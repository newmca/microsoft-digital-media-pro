id: io.github.newmca.DmpKeys
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: dmpkeys

build-options:
  env:
    # Strip the QtWebEngine parts of the BaseApp; dmpkeys does not use them.
    BASEAPP_REMOVE_WEBENGINE: '1'
    BASEAPP_REMOVE_PYWEBENGINE: '1'

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # KDE global shortcuts (the app registers the key bindings there).
  - --talk-name=org.kde.kglobalaccel
  # flatpak-spawn --host: pkexec (root helper), gsettings, kbuildsycoca6.
  - --talk-name=org.freedesktop.Flatpak
  # Launcher .desktop files the app writes for the keys.
  - --filesystem=xdg-data/applications:create
  # Read the host's installed apps, udev/hwdb files and rebind script.
  - --filesystem=host-os:ro
  - --filesystem=host-etc:ro
  - --filesystem=xdg-data/flatpak/exports/share:ro
  - --filesystem=/var/lib/flatpak/exports/share:ro
  - --filesystem=xdg-config/kdeglobals:ro

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - name: python3-jeepney
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} --no-build-isolation jeepney
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/b2/a3/e137168c9c44d18eff0376253da9f1e9234d0239e0ee230d2fee6cea8e55/jeepney-0.9.0-py3-none-any.whl
        sha256: 97e5714520c16fc0a45695e5365a2e11b81ea79bba796e26f9f1d178cb182683

  - name: dmpkeys
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-index --prefix=${FLATPAK_DEST} --no-deps --no-build-isolation .
      - install -Dm0644 data/io.github.newmca.DmpKeys.desktop -t /app/share/applications
      - install -Dm0644 data/io.github.newmca.DmpKeys.metainfo.xml -t /app/share/metainfo
      - install -Dm0644 data/icons/hicolor/scalable/apps/io.github.newmca.DmpKeys.svg
        -t /app/share/icons/hicolor/scalable/apps
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .flatpak-builder
          - dist
          - build
          - packaging
          - docs
          - tests
